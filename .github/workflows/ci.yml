# The public mirror's CI (github.com/Yumankind/overblast-feedback-web).
#
# It lives at the PACKAGE root because `scripts/mirror.sh` splits this directory into the root of
# that repository, which is the only place GitHub Actions looks for a workflow. In the monorepo it
# is an inert file: nothing there dispatches it.
#
# The tests run under Node's own type stripping (`node --test test/*.test.ts`), which is stable
# from Node 22. Node 20 is the floor `engines` claims for building; its leg typechecks and builds,
# which is the whole of what a consumer on 20 receives.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      # The version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # The lockfile travels with the mirror. Dev dependencies only: the package has none at runtime.
      - run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm run typecheck

      - name: build
        run: pnpm run build

      - name: test
        if: matrix.node != '20'
        run: pnpm test

      - name: the published files import cleanly
        run: node -e "import('./dist/index.js').then((m) => { if (typeof m.init !== 'function') { throw new Error('dist/index.js does not export init'); } })"
